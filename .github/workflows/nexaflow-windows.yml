name: NexaFlow Suporte - Windows x86_64

# Standalone, manually-dispatched build that produces a fully NexaFlow-branded
# Windows x86_64 flutter client (portable, unsigned) pointing at the self-hosted
# rendezvous server. Branding (app name, icons, exe properties) and the embedded
# server/public key are applied at build time so the committed tree only changes
# under .github/** (keeping the heavy push-triggered CI quiet).

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"

jobs:
  # Minimal flutter-rust-bridge generation (only the default 3.22.3 bridge that
  # the x86_64 windows build consumes). Mirrors .github/workflows/bridge.yml's
  # first matrix entry.
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # Builds the small WindowInjection.dll helper (top-most prompt window).
  build-topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: NexaFlow Windows x86_64
    needs: [generate-bridge, build-topmost]
    # Build even if the (non-essential) top-most helper fails, as long as the
    # bridge is available.
    if: ${{ always() && needs.generate-bridge.result == 'success' }}
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply NexaFlow branding and embed server
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          set -euo pipefail

          echo "::group::Icons"
          cp .github/nexaflow/icon.ico flutter/windows/runner/resources/app_icon.ico
          cp .github/nexaflow/icon.ico res/icon.ico
          cp .github/nexaflow/icon.ico res/tray-icon.ico
          cp .github/nexaflow/icon.svg flutter/assets/icon.svg
          ls -l flutter/windows/runner/resources/app_icon.ico res/icon.ico res/tray-icon.ico flutter/assets/icon.svg
          echo "::endgroup::"

          echo "::group::Runner.rc (exe version resource)"
          rc=flutter/windows/runner/Runner.rc
          sed -i 's#VALUE "CompanyName", "[^"]*"#VALUE "CompanyName", "NexaFlow"#' "$rc"
          sed -i 's#VALUE "FileDescription", "[^"]*"#VALUE "FileDescription", "NexaFlow Suporte - Acesso Remoto"#' "$rc"
          sed -i 's#VALUE "InternalName", "[^"]*"#VALUE "InternalName", "NexaFlow Suporte"#' "$rc"
          sed -i 's#VALUE "LegalCopyright", "[^"]*"#VALUE "LegalCopyright", "Copyright (C) 2026 NexaFlow. Todos os direitos reservados."#' "$rc"
          sed -i 's#VALUE "OriginalFilename", "[^"]*"#VALUE "OriginalFilename", "NexaFlow-Suporte.exe"#' "$rc"
          sed -i 's#VALUE "ProductName", "[^"]*"#VALUE "ProductName", "NexaFlow Suporte"#' "$rc"
          grep -n 'VALUE "' "$rc"
          echo "::endgroup::"

          echo "::group::Cargo.toml winres"
          sed -i 's#^ProductName = ".*"#ProductName = "NexaFlow Suporte"#' Cargo.toml
          sed -i 's#^FileDescription = ".*"#FileDescription = "NexaFlow Suporte - Acesso Remoto"#' Cargo.toml
          sed -i 's#^OriginalFilename = ".*"#OriginalFilename = "NexaFlow-Suporte.exe"#' Cargo.toml
          sed -i 's#^LegalCopyright = ".*"#LegalCopyright = "Copyright (C) 2026 NexaFlow."#' Cargo.toml
          sed -n '/\[package.metadata.winres\]/,+4p' Cargo.toml
          echo "::endgroup::"

          echo "::group::hbb_common config.rs (APP_NAME + server + key)"
          cfg=libs/hbb_common/src/config.rs
          test -f "$cfg" || { echo "config.rs missing - submodule not checked out"; exit 1; }
          sed -i 's#RwLock::new("RustDesk".to_owned())#RwLock::new("NexaFlow".to_owned())#' "$cfg"
          sed -i "s#pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[\"rs-ny.rustdesk.com\"\];#pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${RENDEZVOUS_SERVER}\"];#" "$cfg"
          sed -i "s#pub const RS_PUB_KEY: &str = \"OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=\";#pub const RS_PUB_KEY: \&str = \"${RS_PUB_KEY}\";#" "$cfg"
          grep -n 'APP_NAME: RwLock\|pub const RENDEZVOUS_SERVERS:\|pub const RS_PUB_KEY:' "$cfg"
          echo "::endgroup::"

          echo "::group::Verify patches applied"
          fail=0
          grep -q 'RwLock::new("NexaFlow".to_owned())' "$cfg" || { echo "APP_NAME not patched"; fail=1; }
          if grep -q 'rs-ny.rustdesk.com' "$cfg"; then echo "server still default"; fail=1; fi
          if grep -q 'OeVuKk5nlHiXp' "$cfg"; then echo "pub key still default"; fail=1; fi
          grep -Eq 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\["[^"]+"\];' "$cfg" || { echo "server empty/malformed (is the RENDEZVOUS_SERVER secret set?)"; fail=1; }
          grep -Eq 'pub const RS_PUB_KEY: &str = "[^"]+";' "$cfg" || { echo "pub key empty/malformed (is the RS_PUB_KEY secret set?)"; fail=1; }
          test "$fail" = "0" || { echo "Branding/embed verification failed"; exit 1; }
          echo "All NexaFlow patches verified."
          echo "::endgroup::"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload NexaFlow unsigned Windows client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: rustdesk
          if-no-files-found: error
